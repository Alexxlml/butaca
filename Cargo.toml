[package]
name = "butaca"
version = "0.1.0"
edition = "2021"
description = "Discord Rich Presence for Kodi (unofficial)"
license = "MIT"
repository = "https://github.com/Alexxlml/butaca"
readme = "README.md"
authors = ["Marco Alexis Zacarias Rubio"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }
log = "0.4.34"
base64 = "0.23.1"
percent-encoding = "2.3.2"
tao = "0.37.2"
tray-icon = "0.26.1"
keyring = "4.2.0"
mdns-sd = "0.21.6"
winreg = "0.56.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
