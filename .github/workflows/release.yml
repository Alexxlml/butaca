name: Release

# Al subir un tag "vX.Y.Z" compila el .exe en Windows y publica un Release
# con el ejecutable, su SHA-256 y las licencias de terceros.
# También se puede lanzar a mano (Actions > Release > Run workflow) para probar la
# compilación y el empaquetado sin publicar nada: el resultado queda como artefacto.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG.TrimStart("v")
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
            throw "Tag $env:TAG does not match Cargo.toml version $cargoVersion"
          }

      - name: Update Rust
        run: rustup update stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "Butaca-$($env:TAG)-x64.exe"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\butaca.exe "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "dist\$name.sha256" -Encoding ascii
          python scripts/third_party_licenses.py dist/THIRD-PARTY-LICENSES.txt

      - name: Upload build (manual runs only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: butaca-test-build
          path: dist/
          retention-days: 3

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $flags = @()
          if ($env:TAG -match "-") { $flags += "--prerelease" }
          gh release create $env:TAG (Get-ChildItem dist | ForEach-Object { $_.FullName }) --title "Butaca $env:TAG" --generate-notes @flags
